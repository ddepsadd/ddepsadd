<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monero — ddepsadd</title>
<meta name="theme-color" content="#24273a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --base:      #24273a;
    --mantle:    #1e2030;
    --crust:     #181926;
    --surface0:  #363a4f;
    --surface1:  #494d64;
    --text:      #cad3f5;
    --dim:       #8087a2;
    --overlay:   #6e738d;
    --peach:     #f5a97f;
    --teal:      #8bd5ca;
    --mauve:     #c6a0f6;

    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--base);
    background-image:
      radial-gradient(760px 420px at 50% -10%, rgba(245,169,127,.10), transparent 70%),
      radial-gradient(560px 360px at 12% 108%, rgba(198,160,246,.08), transparent 70%);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 600px;
    background: var(--mantle);
    border: 1px solid var(--surface0);
    border-radius: 18px;
    padding: clamp(24px, 5vw, 36px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
  }
  .brand svg { flex: none; }
  .brand span {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--overlay);
  }

  /* ---- address ---- */

  .addr {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--crust);
    border: 1px solid var(--surface0);
    border-radius: 12px;
    padding: 18px;
    margin: 0 0 14px;
    font-family: var(--mono);
    font-size: clamp(12px, 2.9vw, 15px);
    color: inherit;
    cursor: pointer;
    transition: border-color .18s ease;
  }
  .addr:hover { border-color: var(--surface1); }
  .addr:focus-visible {
    outline: 2px solid var(--mauve);
    outline-offset: 3px;
  }

  .addr-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 13px;
  }

  .chunk {
    letter-spacing: .04em;
    border-radius: 3px;
  }
  .chunk.odd  { color: var(--dim);  font-weight: 400; }
  .chunk.even { color: var(--text); font-weight: 500; }
  .chunk.edge { color: var(--peach); font-weight: 700; }

  .chunk.lit { animation: sweep .5s ease both; }
  @keyframes sweep {
    40% { color: var(--teal); transform: translateY(-2px); }
  }

  .verify {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 22px;
    font-size: 12px;
    color: var(--overlay);
  }
  .verify em {
    font-style: normal;
    font-weight: 700;
    color: var(--peach);
  }

  /* ---- action ---- */

  .copy {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border: 0;
    border-radius: 11px;
    background: var(--peach);
    color: var(--crust);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .18s ease, transform .1s ease;
  }
  .copy:hover { background: #f7b995; }
  .copy:active { transform: scale(.99); }
  .copy:focus-visible {
    outline: 2px solid var(--mauve);
    outline-offset: 3px;
  }
  .copy.done { background: var(--teal); }

  /* ---- footer ---- */

  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--surface0);
    font-size: 12px;
  }
  .foot a {
    color: var(--dim);
    text-decoration: none;
    border-bottom: 1px solid var(--surface1);
    padding-bottom: 1px;
    transition: color .18s ease, border-color .18s ease;
  }
  .foot a:hover {
    color: var(--mauve);
    border-color: var(--mauve);
  }
  .foot a:focus-visible {
    outline: 2px solid var(--mauve);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="card">

  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#f5a97f" stroke-width="2"/>
      <path d="M9 22.5V10.5l7 7 7-7v12" fill="none" stroke="#f5a97f"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>MONERO · XMR</span>
  </div>

  <button class="addr" id="addr" type="button" aria-describedby="hint">
    <span class="addr-grid" id="grid"></span>
  </button>

  <p class="verify" id="hint">
    Сверьте края: <em id="head"></em> … <em id="tail"></em>
  </p>

  <button class="copy" id="copy" type="button">Скопировать адрес</button>
  <p class="sr" role="status" aria-live="polite" id="live"></p>

  <div class="foot">
    <a href="https://github.com/ddepsadd">Профиль на GitHub</a>
    <a href="https://pay.cloudtips.ru/p/c2e4b0f4">Поддержать картой</a>
  </div>

</main>

<script>
  const ADDRESS = '43Quk4BrSsv3xTcYHkjXVA6whnqycQMMqg9Qg4QzKXGDfJVNKWdubygUhCs1Rbn52gCe5jCvng5raBKMw9NeouhMDVs5zXb';

  const grid = document.getElementById('grid');
  const copyBtn = document.getElementById('copy');
  const addrBtn = document.getElementById('addr');
  const live = document.getElementById('live');

  const chunks = ADDRESS.match(/.{1,6}/g) || [];
  const last = chunks.length - 1;

  chunks.forEach((part, i) => {
    const el = document.createElement('span');
    if (i === 0 || i === last) {
      el.className = 'chunk edge';
    } else {
      el.className = 'chunk ' + (i % 2 ? 'odd' : 'even');
    }
    el.textContent = part;
    grid.appendChild(el);
  });

  document.getElementById('head').textContent = ADDRESS.slice(0, 4);
  document.getElementById('tail').textContent = ADDRESS.slice(-4);

  let resetTimer;

  async function copyAddress() {
    try {
      await navigator.clipboard.writeText(ADDRESS);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = ADDRESS;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (!ok) return failed();
    }
    succeeded();
  }

  function succeeded() {
    clearTimeout(resetTimer);
    copyBtn.textContent = 'Адрес скопирован';
    copyBtn.classList.add('done');
    live.textContent = 'Адрес скопирован в буфер обмена';

    grid.querySelectorAll('.chunk').forEach((el, i) => {
      el.classList.remove('lit');
      void el.offsetWidth;
      el.style.animationDelay = (i * 24) + 'ms';
      el.classList.add('lit');
    });

    resetTimer = setTimeout(() => {
      copyBtn.textContent = 'Скопировать адрес';
      copyBtn.classList.remove('done');
    }, 2000);
  }

  function failed() {
    clearTimeout(resetTimer);
    copyBtn.textContent = 'Не скопировалось — выделите адрес вручную';
    live.textContent = 'Скопировать не удалось. Выделите адрес и скопируйте вручную.';
    resetTimer = setTimeout(() => {
      copyBtn.textContent = 'Скопировать адрес';
    }, 3000);
  }

  copyBtn.addEventListener('click', copyAddress);
  addrBtn.addEventListener('click', copyAddress);
</script>

</body>
</html>
